services:
  fledgling:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      - EBIRD_API_KEY=${EBIRD_API_KEY}
      - OSRM_BASE_URL=http://osrm:5000
    depends_on:
      - osrm

  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v26.9.0
    restart: unless-stopped
    command: osrm-routed --algorithm mld /data/north-america-latest.osrm
    volumes:
      - ./data/osrm:/data:ro
    expose:
      - "5000"
