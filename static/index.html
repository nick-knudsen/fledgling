<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listr - Hotspot Optimizer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/styles.css" />
</head>
<body>
    <header>
        <div>
            <h1>Listr</h1>
            <p>Find the best birding hotspots to maximize your life birds</p>
        </div>
    </header>

    <div class="theme-switch" id="theme-toggle" title="Toggle dark mode">
        <span class="theme-switch-icon light">&#9788;</span>
        <span class="theme-switch-knob"></span>
        <span class="theme-switch-icon dark">&#9790;</span>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="form-group">
                <label>Your eBird Data</label>
                <input type="file" id="csv-input" accept=".csv" />
                <div id="file-status" class="file-status">Upload your MyEBirdData.csv from eBird</div>
            </div>

            <div class="form-group">
                <label>Life List Scope</label>
                <select id="scope-country" disabled>
                    <option value="">World (all countries)</option>
                </select>
                <select id="scope-state" disabled style="margin-top: 0.4rem;">
                    <option value="">All states/provinces</option>
                </select>
                <select id="scope-county" disabled style="margin-top: 0.4rem;">
                    <option value="">All counties</option>
                </select>
            </div>

            <div class="form-group">
                <label>Search Area</label>
                <div class="multi-select" id="country-select">
                    <div class="multi-select-display" id="country-display">All countries</div>
                    <div class="multi-select-dropdown" id="country-dropdown"></div>
                </div>
                <div class="multi-select" id="state-select" style="margin-top: 0.4rem;">
                    <div class="multi-select-display" id="state-display">All states</div>
                    <div class="multi-select-dropdown" id="state-dropdown"></div>
                </div>
                <div class="multi-select" id="county-select" style="margin-top: 0.4rem;">
                    <div class="multi-select-display" id="county-display">All counties</div>
                    <div class="multi-select-dropdown" id="county-dropdown"></div>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Start Date</label>
                    <input type="date" id="start-date" />
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <input type="date" id="end-date" />
                </div>
            </div>

            <div class="form-group">
                <label>Number of Hotspots</label>
                <input type="number" id="k-input" value="5" min="1" max="20" />
            </div>

            <button class="primary" id="optimize-btn" disabled>Optimize</button>
        </aside>

        <main class="main" id="results">
            <div class="empty-state">
                <p>Upload your eBird data and select your trip parameters to get started.</p>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app.js"></script>
</body>
</html>
