<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listr - Hotspot Optimizer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/styles.css" />
    <script>document.documentElement.setAttribute("data-theme", window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");</script>
</head>
<body>
    <div class="theme-switch" id="theme-toggle" title="Toggle dark mode">
        <span class="theme-switch-knob"></span>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="sidebar-logo">
                <img src="/logos/logo_light.png" alt="Listr" class="logo logo-light"><img src="/logos/logo_dark.png" alt="Listr" class="logo logo-dark">
                <p>Find the best birding hotspots</p>
            </div>
            <div class="form-group">
                <label>Target Species...</label>
                <div class="list-type-toggle">
                    <button class="target-mode-btn active" data-mode="search">By Search</button>
                    <button class="target-mode-btn" data-mode="lifelist">You Haven't Seen</button>
                </div>
                <div id="target-search-inputs">
                    <div class="species-search">
                        <input type="text" id="species-input" placeholder="Enter species name or code..." autocomplete="off" />
                        <div class="species-dropdown" id="species-dropdown"></div>
                    </div>
                </div>
                <div id="target-lifelist-inputs" style="display: none;">
                    <input type="file" id="csv-input" accept=".csv" />
                    <div id="file-status" class="form-hint">Upload your MyEBirdData.csv from eBird</div>
                    <div class="list-type-toggle" style="margin-top: 0.4rem;">
                        <button class="list-type-btn active" data-type="life">Life</button>
                        <button class="list-type-btn" data-type="year">Year</button>
                    </div>
                    <select id="scope-country" disabled style="margin-top: 0.4rem;">
                        <option value="">World (all countries)</option>
                    </select>
                    <select id="scope-state" disabled style="margin-top: 0.4rem;">
                        <option value="">All states/provinces</option>
                    </select>
                    <select id="scope-county" disabled style="margin-top: 0.4rem;">
                        <option value="">All counties</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Search Area</label>
                <div class="list-type-toggle">
                    <button class="search-mode-btn active" data-mode="region">Region</button>
                    <button class="search-mode-btn" data-mode="driving">Driving Time</button>
                </div>
                <div id="region-inputs">
                    <div class="multi-select" id="country-select">
                        <div class="multi-select-display" id="country-display">World (all countries)</div>
                        <div class="multi-select-dropdown" id="country-dropdown"></div>
                    </div>
                    <div class="multi-select" id="state-select" style="margin-top: 0.4rem;">
                        <div class="multi-select-display" id="state-display">All states/provinces</div>
                        <div class="multi-select-dropdown" id="state-dropdown"></div>
                    </div>
                    <div class="multi-select" id="county-select" style="margin-top: 0.4rem;">
                        <div class="multi-select-display" id="county-display">All counties</div>
                        <div class="multi-select-dropdown" id="county-dropdown"></div>
                    </div>
                </div>
                <div id="driving-inputs" style="display: none;">
                    <div class="form-hint" style="margin-bottom: 0.3rem;">From...</div>
                    <div class="location-search">
                        <div class="location-input-row">
                            <input type="text" id="location-input" placeholder="Search for a location..." autocomplete="off" />
                            <button type="button" id="use-my-location" class="location-btn" title="Use my current location">
                                <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/><line x1="8" y1="0.5" x2="8" y2="3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="8" y1="13" x2="8" y2="15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="0.5" y1="8" x2="3" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><line x1="13" y1="8" x2="15.5" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
                            </button>
                        </div>
                        <div class="location-dropdown" id="location-dropdown"></div>
                    </div>
                    <div id="location-selected" class="location-selected"></div>
                    <div class="form-hint" style="margin-top: 0.5rem; margin-bottom: 0.3rem;">Up to...</div>
                    <div class="driving-time-input">
                        <input type="number" id="max-driving-minutes" min="1" max="480" />
                        <span class="driving-time-suffix">minutes</span>
                    </div>
                </div>
            </div>

            <div class="date-row">
                <div class="form-group">
                    <label>Start Date</label>
                    <div class="date-selects">
                        <select id="start-month"></select>
                        <select id="start-day"></select>
                    </div>
                </div>
                <div class="form-group">
                    <label>End Date</label>
                    <div class="date-selects">
                        <select id="end-month"></select>
                        <select id="end-day"></select>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Number of Hotspots</label>
                <input type="number" id="k-input" value="5" min="1" max="20" />
            </div>

            <button class="primary" id="optimize-btn" disabled>Optimize</button>
        </aside>

        <main class="main" id="results">
            <div class="empty-state">
                <p>Select your search parameters to get started.</p>
            </div>
        </main>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/app.js"></script>
</body>
</html>
