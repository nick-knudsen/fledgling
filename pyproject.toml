[project]
name = "fledgling"
version = "0.1.0"
description = "Hotspot search and trip planning for birders, backed by eBird data."
authors = [
    { name = "Nick Knudsen", email = "nick.knudsen14@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.4,<1.5",
    "fastapi>=0.129,<0.130",
    "httpx>=0.28,<0.29",
    "numpy>=2.3,<3",
    "pandas>=2.3,<3",
    "playwright==1.58.0",
    "pydantic>=2.13,<2.14",
    "uvicorn>=0.40,<0.41",
]

# This is an application (deployed via Docker/uvicorn), not a distributable package,
# so there's no build backend or entry point to define.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.3",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["data", ".venv", ".venv-wsl"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names, etc.)
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear (common bug-shaped patterns)
    "SIM", # simplify
]

# Baseline for a codebase with no prior lint history: start from what's above and
# tighten over time rather than fixing everything in one pass.
[tool.mypy]
python_version = "3.12"
exclude = ["^data/", "^\\.venv"]
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
# Third-party libs here don't ship types (or we haven't checked yet) — revisit
# per-package as stubs become available instead of blanket-ignoring forever.
[[tool.mypy.overrides]]
module = ["duckdb.*"]
ignore_missing_imports = true
