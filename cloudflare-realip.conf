# Restores the real visitor IP once Cloudflare proxies all traffic.
#
# Without this, nginx logs Cloudflare's edge IP as $remote_addr for every
# request (since that's who's actually connecting), so this app's
# X-Real-IP/X-Forwarded-For headers, access logs, and any future rate
# limiting would all see Cloudflare's IPs instead of visitors'.
# ngx_http_realip_module trusts these ranges and pulls the real client IP
# from the CF-Connecting-IP header Cloudflare adds.
#
# Deployed to /etc/nginx/conf.d/ (loaded by nginx's default `http {}` block)
# rather than into the site file in nginx.conf, so it survives certbot's
# automatic edits to that file and doesn't need to be duplicated per-server-block.
#
# List from https://www.cloudflare.com/ips/ - fetched 2026-08-30, changes
# rarely but isn't permanent; re-fetch if requests start showing the wrong
# client IP.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
